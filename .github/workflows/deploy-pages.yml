name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject GAS_WEB_APP_URL
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
        run: |
          if [ -z "$GAS_WEB_APP_URL" ]; then
            echo "::error::リポジトリ変数 GAS_WEB_APP_URL が未設定です。Settings > Secrets and variables > Actions > Variables で設定してください。"
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib
          path = pathlib.Path("github-pages/config.js")
          text = path.read_text(encoding="utf-8")
          if "__GAS_WEB_APP_URL__" not in text:
              raise SystemExit("プレースホルダ __GAS_WEB_APP_URL__ が見つかりません。")
          path.write_text(text.replace("__GAS_WEB_APP_URL__", os.environ["GAS_WEB_APP_URL"]), encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: github-pages

      - id: deployment
        uses: actions/deploy-pages@v4
